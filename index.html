<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зайцы — музыкальная платформа</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:#333;font:13px Arial}
a{color:#2875a8;text-decoration:none}button{cursor:pointer}
.top{height:48px;background:linear-gradient(#fafafa,#ddd);border-bottom:1px solid #aaa}
.topin,.wrap{width:1000px;margin:auto}.topin{height:48px;display:flex;align-items:center;gap:25px}
.logo{font-size:24px;font-weight:bold;color:#555}.logo span{color:#7cab32}
.nav button{border:0;background:none;color:#555;padding:15px 9px}.nav button:hover{background:#eee}
.account{margin-left:auto}.account button,.green{background:#82b238;color:#fff;border:1px solid #6b972a;padding:7px 13px}
.wrap{background:#fff;min-height:calc(100vh - 48px);box-shadow:0 0 5px #bbb}
.head{padding:18px;border-bottom:1px solid #ddd;background:#f8f8f8}
.search{display:flex}.search input{height:40px;flex:1;border:1px solid #aaa;padding:0 12px;font-size:15px}.search button{width:95px;background:#7eac36;color:white;border:1px solid #638b27}
.grid{display:grid;grid-template-columns:1fr 280px;gap:20px;padding:18px}.title{font-size:21px;margin-bottom:13px}
.tabs{border-bottom:1px solid #bbb;margin-bottom:10px}.tabs button{padding:8px 12px;border:0;background:none}.tabs .on{border:1px solid #bbb;border-bottom-color:white;margin-bottom:-1px;font-weight:bold}
.track{display:grid;grid-template-columns:34px 1fr 60px 35px;align-items:center;min-height:52px;border-bottom:1px solid #e4e4e4}.track:hover{background:#f7f7f7}
.num{text-align:center;color:#aaa}.song b{display:block}.song small{color:#999}.time{color:#999;text-align:right}.play{border:0;background:#82b238;color:#fff;border-radius:50%;width:26px;height:26px}
.box{border:1px solid #ccc;margin-bottom:15px;background:#fafafa}.box h3{margin:0;padding:9px;background:linear-gradient(#f8f8f8,#e2e2e2);border-bottom:1px solid #ccc}.box .inside{padding:10px}
input,select{padding:9px;border:1px solid #aaa;width:100%;margin:5px 0 9px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{width:390px;background:#fff;padding:20px;box-shadow:0 4px 20px #222}.dialog h2{margin-top:0}.error{color:#b22;margin:8px 0}.close{float:right;border:0;background:none;font-size:20px}
.player{position:fixed;bottom:0;left:0;right:0;height:72px;background:linear-gradient(#555,#292929);color:white;border-top:2px solid #111}.playerin{width:1000px;margin:auto;height:100%;display:flex;align-items:center;gap:12px}
.big{width:42px;height:42px;border:0;background:#82b238;color:#fff;border-radius:4px;font-size:17px}.now{width:250px;white-space:nowrap;overflow:hidden}.now b{display:block}.now small{color:#bbb}.bar{height:6px;background:#777;flex:1;border-radius:4px}.bar i{display:block;height:100%;width:0;background:#92bf48}.muted{color:#aaa}.me{font-weight:bold}
.contentBottom{height:100px}
.empty{padding:30px;text-align:center;color:#999}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <div class="logo">ЗАЙЦЫ<span>.NET</span></div>
  <div class="nav">
    <button onclick="showHome()">Музыка</button>
    <button onclick="showPlaylists()">Мои плейлисты</button>
    <button onclick="showUpload()">Загрузить</button>
  </div>
  <div class="account" id="account"></div>
</div></div>
<div class="wrap">
  <div class="head"><div class="search"><input id="q" placeholder="Найти песню или исполнителя..." onkeydown="if(event.key==='Enter')loadTracks()"><button onclick="loadTracks()">НАЙТИ</button></div></div>
  <div class="grid"><main id="main"></main><aside>
    <div class="box"><h3>Аккаунт</h3><div class="inside" id="sideAccount">Загрузка...</div></div>
    <div class="box"><h3>Возможности</h3><div class="inside">🎵 Музыка<br><br>⬆ Загрузка MP3<br><br>📁 Плейлисты<br><br>▶ HTML5-плеер</div></div>
  </aside></div>
  <div class="contentBottom"></div>
</div>
<div class="player"><div class="playerin">
  <button class="big" id="playBtn" onclick="toggle()">▶</button>
  <div class="now"><b id="now">Выберите трек</b><small id="artist">Музыкальный плеер</small></div>
  <div class="bar"><i id="progress"></i></div><span class="muted">🔊</span>
</div></div>
<audio id="audio"></audio>

<div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>

<script>
const $=s=>document.querySelector(s); const audio=$("#audio");
let me=null, current=null;

async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}
async function init(){const d=await api("/api/me");me=d.user;renderAccount();loadTracks()}
function renderAccount(){
 $("#account").innerHTML=me?`<span class="me">${esc(me.username)}</span> <button onclick="logout()">Выйти</button>`:`<button onclick="auth('login')">Войти</button> <button class="green" onclick="auth('register')">Регистрация</button>`;
 $("#sideAccount").innerHTML=me?`Вы вошли как <b>${esc(me.username)}</b><br><br><button onclick="showUpload()">Загрузить музыку</button>`:`<span class="muted">Войдите, чтобы загружать музыку и создавать плейлисты.</span>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadTracks(){
 const tracks=await api("/api/tracks?q="+encodeURIComponent($("#q").value));
 $("#main").innerHTML=`<div class="title">Музыка</div><div class="tabs"><button class="on">Все треки</button><button onclick="showUpload()">Загрузить</button></div>`;
 if(!tracks.length)$("#main").innerHTML+=`<div class="empty">Пока нет треков. Зарегистрируйся и загрузи первый.</div>`;
 tracks.forEach((t,i)=>$("#main").innerHTML+=trackHTML(t,i));
}
function trackHTML(t,i){return `<div class="track"><div class="num">${i+1}</div><div class="song"><b>${esc(t.title)}</b><small>${esc(t.artist)} · загрузил ${esc(t.uploader)}</small></div><div class="time">♫</div><button class="play" onclick='playTrack(${JSON.stringify(t)})'>▶</button></div>`}
function playTrack(t){current=t;audio.src=t.url;audio.play();$("#now").textContent=t.title;$("#artist").textContent=t.artist;$("#playBtn").textContent="❚❚"}
function toggle(){if(!current)return;if(audio.paused){audio.play();$("#playBtn").textContent="❚❚"}else{audio.pause();$("#playBtn").textContent="▶"}}
audio.addEventListener("timeupdate",()=>$("#progress").style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%");
audio.addEventListener("ended",()=>$("#playBtn").textContent="▶");

function auth(mode){
 $("#modalContent").innerHTML=`<h2>${mode==="login"?"Вход":"Регистрация"}</h2><input id="u" placeholder="Логин"><input id="p" type="password" placeholder="Пароль"><div class="error" id="err"></div><button class="green" onclick="submitAuth('${mode}')">${mode==="login"?"Войти":"Создать аккаунт"}</button>`;
 $("#modal").classList.add("show")
}
async function submitAuth(mode){try{await api("/api/"+(mode==="login"?"login":"register"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("#u").value,password:$("#p").value})});closeModal();const d=await api("/api/me");me=d.user;renderAccount();showHome()}catch(e){$("#err").textContent=e.message}}
function closeModal(){$("#modal").classList.remove("show")}
async function logout(){await api("/api/logout",{method:"POST"});me=null;renderAccount();showHome()}

function showUpload(){
 if(!me)return auth("login");
 $("#main").innerHTML=`<div class="title">Загрузить музыку</div><div class="box"><div class="inside">
 <form id="uploadForm"><label>Название</label><input name="title" placeholder="Название песни" required>
 <label>Исполнитель</label><input name="artist" placeholder="Исполнитель" required>
 <label>Аудиофайл</label><input type="file" name="audio" accept=".mp3,.wav,.ogg,audio/*" required>
 <button class="green">Загрузить трек</button><div id="upmsg"></div></form></div></div>`;
 $("#uploadForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api("/api/upload",{method:"POST",body:fd});$("#upmsg").textContent="Трек загружен!";setTimeout(showHome,600)}catch(x){$("#upmsg").textContent=x.message}}
}
async function showPlaylists(){
 if(!me)return auth("login");
 const lists=await api("/api/playlists");
 $("#main").innerHTML=`<div class="title">Мои плейлисты</div><button class="green" onclick="newPlaylist()">+ Новый плейлист</button><div id="lists"></div>`;
 const box=$("#lists");
 if(!lists.length)box.innerHTML=`<div class="empty">Плейлистов пока нет.</div>`;
 lists.forEach(p=>box.innerHTML+=`<div class="box" style="margin-top:12px"><h3>📁 ${esc(p.name)} <button style="float:right" onclick="deletePlaylist(${p.id})">Удалить</button></h3><div class="inside">${p.tracks.length?p.tracks.map((t,i)=>trackHTML(t,i)).join(""):"Плейлист пуст."}</div></div>`);
}
async function newPlaylist(){const name=prompt("Название плейлиста:");if(name){await api("/api/playlists",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});showPlaylists()}}
async function deletePlaylist(id){if(confirm("Удалить плейлист?")){await api("/api/playlists/"+id,{method:"DELETE"});showPlaylists()}}
function showHome(){loadTracks()}
init();
</script>
</body>
</html>
